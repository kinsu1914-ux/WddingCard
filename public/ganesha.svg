<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Outer glow ring -->
  <circle cx="60" cy="60" r="58" fill="#7B1C2E" stroke="#C9A84C" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="52" fill="none" stroke="#C9A84C" stroke-width="0.8" stroke-dasharray="4 3"/>

  <!-- Crown / Mukut -->
  <path d="M38,30 L45,18 L52,26 L60,14 L68,26 L75,18 L82,30 Z" fill="#C9A84C"/>
  <circle cx="60" cy="17" r="3" fill="#FFD700"/>
  <circle cx="46" cy="21" r="2" fill="#FFD700"/>
  <circle cx="74" cy="21" r="2" fill="#FFD700"/>

  <!-- Head (elephant) -->
  <ellipse cx="60" cy="52" rx="22" ry="20" fill="#D4A96A"/>
  <!-- Face shading -->
  <ellipse cx="60" cy="54" rx="16" ry="14" fill="#E8C07A"/>

  <!-- Big ears -->
  <ellipse cx="34" cy="52" rx="13" ry="16" fill="#D4A96A"/>
  <ellipse cx="34" cy="52" rx="9" ry="12" fill="#C89060"/>
  <ellipse cx="86" cy="52" rx="13" ry="16" fill="#D4A96A"/>
  <ellipse cx="86" cy="52" rx="9" ry="12" fill="#C89060"/>

  <!-- Eyes -->
  <ellipse cx="52" cy="47" rx="4" ry="4.5" fill="white"/>
  <ellipse cx="68" cy="47" rx="4" ry="4.5" fill="white"/>
  <circle cx="52" cy="47" r="2.5" fill="#2C1A0E"/>
  <circle cx="68" cy="47" r="2.5" fill="#2C1A0E"/>
  <circle cx="53" cy="46" r="0.8" fill="white"/>
  <circle cx="69" cy="46" r="0.8" fill="white"/>

  <!-- Third eye / tilak -->
  <ellipse cx="60" cy="41" rx="3" ry="2" fill="#C9A84C"/>
  <circle cx="60" cy="41" r="1" fill="#FFD700"/>

  <!-- Trunk curling right -->
  <path d="M54,60 Q46,70 50,80 Q52,86 58,84" fill="none" stroke="#D4A96A" stroke-width="8" stroke-linecap="round"/>
  <path d="M54,60 Q46,70 50,80 Q52,86 58,84" fill="none" stroke="#C89060" stroke-width="4" stroke-linecap="round"/>
  <!-- Trunk tip curl -->
  <path d="M58,84 Q64,86 63,80" fill="none" stroke="#C89060" stroke-width="4" stroke-linecap="round"/>

  <!-- Body -->
  <ellipse cx="60" cy="90" rx="22" ry="18" fill="#D4A96A"/>
  <ellipse cx="60" cy="90" rx="16" ry="13" fill="#E8C07A"/>

  <!-- Jewelry / necklace -->
  <path d="M44,67 Q60,75 76,67" fill="none" stroke="#C9A84C" stroke-width="2"/>
  <circle cx="60" cy="74" r="2" fill="#FFD700"/>
  <circle cx="52" cy="71" r="1.5" fill="#FFD700"/>
  <circle cx="68" cy="71" r="1.5" fill="#FFD700"/>

  <!-- Modak (sweet) in hand -->
  <ellipse cx="80" cy="84" rx="7" ry="6" fill="#C9A84C"/>
  <ellipse cx="80" cy="82" rx="5" ry="4" fill="#FFD700"/>

  <!-- Lotus / blessing hand on left -->
  <path d="M38,82 Q34,76 36,70 Q40,66 44,70" fill="#C9A84C" opacity="0.9"/>

  <!-- Decorative bottom dots -->
  <circle cx="60" cy="8" r="2" fill="#FFD700"/>
</svg>
